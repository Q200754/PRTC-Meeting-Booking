<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRTC Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #3B82F6;
      --primary-dark: #1D4ED8;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --accent-amber: #F59E0B;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 32px 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-group p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-count {
      background: #FEF3C7;
      color: #B45309;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #F8FAFC;
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px 18px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover td {
      background: #F8FAFC;
    }

    .booking-id {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 13.5px;
    }

    .badge-type {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: #EFF6FF;
      color: #1D4ED8;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      background: #FFFBEB;
      color: #B45309;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #FDE68A;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-opt {
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn-opt.approve { background: var(--accent-green); color: #fff; }
    .btn-opt.approve:hover { background: #059669; }

    .btn-opt.reject { background: var(--accent-red); color: #fff; }
    .btn-opt.reject:hover { background: #DC2626; }

    .btn-opt.delete { background: #E2E8F0; color: #475569; }
    .btn-opt.delete:hover { background: #CBD5E1; }

    .state-container {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .state-container svg {
      margin-bottom: 12px;
      color: #94A3B8;
    }

    @media (max-width: 768px) {
      body { padding: 16px; }
      .header-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-bar">
    <div class="title-group">
      <h1>PRTC Admin Dashboard</h1>
      <p>จัดการคำขอและอนุมัติการจองห้องประชุม</p>
    </div>
    
    <div class="nav-actions">
      <button class="btn-action" onclick="loadBookings()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        รีเฟรชข้อมูล
      </button>
      <a class="btn-action" href="index.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        กลับหน้าจองห้อง
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        รายการคำขอรออนุมัติ
      </h2>
      <span class="badge-count" id="pendingCount">0 รายการ</span>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>ผู้จอง</th>
            <th>ตำแหน่ง/ฝ่าย</th>
            <th>ห้อง / อาคาร</th>
            <th>วันที่ / เวลา</th>
            <th>จำนวน</th>
            <th>ประเภท</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="bookingList">
          <tr>
            <td colspan="9">
              <div class="state-container">
                <p>กำลังโหลดข้อมูลคำขอจองห้องประชุม...</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCILkpE3hCwf3xpqmf5qn5A47NvPfiCafH6sKBipHHWgvJNNWynueLD0QprDqaSgvMYg/exec";

window.onload = function() {
  loadBookings();
};

function loadBookings() {
  const table = document.getElementById("bookingList");
  table.innerHTML = `<tr><td colspan="9"><div class="state-container"><p>กำลังโหลดข้อมูลล่าสุด...</p></div></td></tr>`;

  fetch(SCRIPT_URL + "?action=getBookings")
    .then(res => res.json())
    .then(response => {
      if (!response || !response.ok) {
        table.innerHTML = `<tr><td colspan="9"><div class="state-container"><p>⚠️ ไม่สามารถดึงข้อมูลได้: ${response.errorMessage || 'Unknown Error'}</p></div></td></tr>`;
        return;
      }

      const data = response.data;
      if (!data || data.length <= 1) {
        renderEmpty();
        return;
      }

      const pendingRows = data.slice(1).filter(row => row[8] === "รออนุมัติ");
      document.getElementById("pendingCount").innerText = `${pendingRows.length} รายการ`;

      if (pendingRows.length === 0) {
        renderEmpty();
        return;
      }

      renderTable(pendingRows);
    })
    .catch(err => {
      table.innerHTML = `<tr><td colspan="9"><div class="state-container"><p>⚠️ เกิดข้อผิดพลาดในการโหลดข้อมูล</p></div></td></tr>`;
    });
}

function renderEmpty() {
  document.getElementById("pendingCount").innerText = "0 รายการ";
  document.getElementById("bookingList").innerHTML = `
    <tr>
      <td colspan="9">
        <div class="state-container">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
          <p><b>ยังไม่มีรายการคำขอรออนุมัติ</b></p>
          <p style="font-size: 13px; margin-top: 4px;">เมื่อมีคำขอจองเข้ามา รายการจะปรากฏในหน้านี้ทันที</p>
        </div>
      </td>
    </tr>
  `;
}

function renderTable(rows) {
  const table = document.getElementById("bookingList");
  table.innerHTML = "";

  rows.forEach(row => {
    table.innerHTML += `
      <tr>
        <td><span class="booking-id">${row[0] || "-"}</span></td>
        <td><b>${row[1] || "-"}</b></td>
        <td>${row[2] || "-"}</td>
        <td>${row[3] || "-"}<br><small style="color:var(--text-muted);">${row[4] || ""}</small></td>
        <td>${formatDate(row[5])}<br><small style="color:var(--text-muted);">${row[6] || ""}</small></td>
        <td>${row[7] || "-"} คน</td>
        <td><span class="badge-type">${row[9] || "-"}</span></td>
        <td><span class="badge-status">⏳ ${row[8] || "-"}</span></td>
        <td>
          <div class="btn-group">
            <button class="btn-opt approve" onclick="updateStatus('${row[0]}', 'อนุมัติ')">✓ อนุมัติ</button>
            <button class="btn-opt reject" onclick="updateStatus('${row[0]}', 'ไม่อนุมัติ')">✕ ปฏิเสธ</button>
            <button class="btn-opt delete" onclick="deleteBooking('${row[0]}')">🗑 ลบ</button>
          </div>
        </td>
      </tr>
    `;
  });
}

function updateStatus(id, status) {
  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "updateStatus", payload: { id: id, status: status } })
  })
  .then(res => res.json())
  .then(res => {
    if(res.ok) {
      loadBookings();
    } else {
      alert("ไม่สามารถอัปเดตสถานะได้");
    }
  });
}

function deleteBooking(id) {
  if(!confirm(`ยืนยันการลบรายการจองรหัส ${id} ?`)) return;

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "deleteBooking", payload: { id: id } })
  })
  .then(res => res.json())
  .then(res => {
    if(res.ok) {
      loadBookings();
    } else {
      alert("ไม่สามารถลบรายการได้");
    }
  });
}

function formatDate(date) {
  if (!date) return "-";
  const d = new Date(date);
  if (isNaN(d.getTime())) return date;
  return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" });
}
</script>

</body>
</html>
